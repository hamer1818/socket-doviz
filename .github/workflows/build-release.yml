name: Build and Release

on:
  push:
    tags:
      - 'v*' # v1.0, v1.1, v2.0 gibi sürüm etiketleri için

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed --icon=images/doviz.ico --name DovizTakip-Windows --add-data "images;images" main_gui.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: dist/DovizTakip-Windows.exe

  build-linux-appimage:
    runs-on: ubuntu-20.04  # Daha eski bir Ubuntu sürümü kullanıyoruz
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          sudo apt-get update
          sudo apt-get install -y libxcb-xinerama0 libxcb-cursor0 libxcb1 libqt5gui5 libgl1

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --name DovizTakip-Linux --add-data "images:images" main_gui.py

      - name: Install AppImage tools
        run: |
          sudo apt-get install -y wget fuse
          wget -O appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool

      - name: Create AppDir structure
        run: |
            mkdir -p AppDir/usr/bin
            mkdir -p AppDir/usr/share/applications
            mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
            cp dist/DovizTakip-Linux AppDir/usr/bin/
            
            # Install ImageMagick for icon conversion
            sudo apt-get install -y imagemagick
            
            # İkon dosyasını hem sistem dizinine hem de kök dizine kopyala
            if [ -f "images/doviz.ico" ]; then
              # Convert ico to png (force overwrite)
              convert images/doviz.ico -resize 256x256 AppDir/doviz.png
              cp AppDir/doviz.png AppDir/usr/share/icons/hicolor/256x256/apps/doviz.png
            else
              # Eğer doviz.ico yoksa basit bir ikon oluştur
              convert -size 256x256 xc:transparent -fill blue -draw "circle 128,128 128,64" AppDir/doviz.png
              cp AppDir/doviz.png AppDir/usr/share/icons/hicolor/256x256/apps/doviz.png
            fi
            
            # Make sure icon exists and has correct permissions
            chmod 644 AppDir/doviz.png
            
            # Desktop dosyası oluştur - Icon kısmını güncelle
            echo "[Desktop Entry]
            Name=Döviz Takip
            Exec=DovizTakip-Linux
            Icon=doviz
            Type=Application
            Categories=Office;Finance;" > AppDir/usr/share/applications/doviztakip.desktop
            
            # AppRun dosyası oluştur
            echo '#!/bin/bash
            SELF=$(readlink -f "$0")
            HERE=${SELF%/*}
            export PATH="${HERE}/usr/bin/:${PATH}"
            export LD_LIBRARY_PATH="${HERE}/usr/lib/:${LD_LIBRARY_PATH}"
            "${HERE}/usr/bin/DovizTakip-Linux" "$@"' > AppDir/AppRun
            
            chmod +x AppDir/AppRun
            
            # .desktop dosyasını kök dizine kopyala
            cp AppDir/usr/share/applications/doviztakip.desktop AppDir/doviztakip.desktop
            
            # Debug için dizin içeriğini listele
            echo "--- AppDir Root Content ---"
            ls -la AppDir/
            echo "--- Icon Check ---"
            ls -la AppDir/doviz.png || echo "Icon file missing in root"
            echo "--- Icon in apps directory ---"
            ls -la AppDir/usr/share/icons/hicolor/256x256/apps/ || echo "Apps icon directory is empty"

      - name: Build AppImage
        run: |
          # AppImage oluşturma öncesi debug
          ls -la AppDir/
          ls -la AppDir/usr/share/applications/
          file AppDir/doviz.png
          
          # AppImage oluştur
          ARCH=x86_64 ./appimagetool -v AppDir/ DovizTakip-x86_64.AppImage

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: DovizTakip-x86_64.AppImage

  create-release:
    needs: [build-windows, build-linux-appimage]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            windows-executable/DovizTakip-Windows.exe
            linux-appimage/DovizTakip-x86_64.AppImage
          name: Döviz Takip ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}