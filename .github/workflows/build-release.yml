name: Build and Release

on:
  push:
    tags:
      - 'v*' # v1.0, v1.1, v2.0 gibi sürüm etiketleri için

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed --icon=images/doviz.ico --name DovizTakip-Windows --add-data "images;images" main_gui.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: dist/DovizTakip-Windows.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install pyinstaller
            sudo apt-get update
            sudo apt-get install -y libxcb-xinerama0 libxcb-cursor0 libxcb1 libqt5gui5 libgl1

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --name DovizTakip-Linux --add-data "images:images" main_gui.py

      - name: Set executable permissions
        run: |
          chmod +x dist/DovizTakip-Linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-executable
          path: dist/DovizTakip-Linux

  create-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            windows-executable/DovizTakip-Windows.exe
            linux-executable/DovizTakip-Linux
          name: Döviz Takip ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}